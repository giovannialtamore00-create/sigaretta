<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b190d">
  <title>Sigaretta</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <!-- tratto a matita: fa tremare un po' i bordi disegnati -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="pencil">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div class="desk">
  <div class="page">
    <div class="doodles" aria-hidden="true">
      <svg class="d-star" viewBox="0 0 60 60"><path d="M30 6l6 16 17 1-13 11 5 17-15-10-15 10 5-17L7 23l17-1z" /><path d="M31 9l5 14 15 2-12 10 4 15" opacity=".5"/></svg>
      <svg class="d-spiral" viewBox="0 0 60 60"><path d="M31 30c0-2 3-2 3 0 0 4-6 5-7 0-1-6 8-8 11-2 4 7-4 14-11 12-9-2-11-14-4-20 8-7 21-3 23 8 2 10-6 19-16 19"/></svg>
      <svg class="d-smile" viewBox="0 0 60 60"><path d="M30 6c14-1 25 10 24 24-1 13-11 24-25 23C15 52 6 42 6 29 7 16 17 6 31 7"/><path d="M21 22v5M38 21v5"/><path d="M18 36c6 8 18 9 24-1"/></svg>
      <svg class="d-arrow" viewBox="0 0 90 50"><path d="M4 40c18-26 46-34 76-22"/><path d="M68 9l13 9-15 6"/></svg>
    </div>
    <main id="app"></main>
  </div>

  <!-- posacenere visto dall'alto, con la sigaretta accesa -->
  <div class="ash" aria-hidden="true">
    <svg viewBox="0 0 400 400">
      <defs>
        <filter id="blur14" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
        <filter id="blur4" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
        <filter id="blur7" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
        <filter id="blur10" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
        <filter id="ashNoise" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="4" result="n"/>
          <feColorMatrix in="n" type="matrix" values="1.6 0 0 0 -.25  1.6 0 0 0 -.25  1.6 0 0 0 -.25  0 0 0 0 1"/>
          <feComposite in2="SourceGraphic" operator="in"/>
        </filter>
        <radialGradient id="rimG" cx="40%" cy="36%" r="75%"><stop offset="0" stop-color="#f6f1e6"/><stop offset=".65" stop-color="#d6ccb8"/><stop offset="1" stop-color="#a39a85"/></radialGradient>
        <radialGradient id="wellG" cx="50%" cy="50%" r="50%"><stop offset=".55" stop-color="#8a8272"/><stop offset=".92" stop-color="#4f483a"/><stop offset="1" stop-color="#2d281f"/></radialGradient>
        <radialGradient id="bedG" cx="46%" cy="44%" r="60%"><stop offset="0" stop-color="#c3bfb5"/><stop offset="1" stop-color="#85817a"/></radialGradient>
        <linearGradient id="paperG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8b4aa"/><stop offset=".28" stop-color="#fbfaf6"/><stop offset=".5" stop-color="#fff"/><stop offset=".82" stop-color="#e2dfd7"/><stop offset="1" stop-color="#a5a197"/></linearGradient>
        <linearGradient id="filterG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#85571f"/><stop offset=".3" stop-color="#e5b46a"/><stop offset=".5" stop-color="#f1ca89"/><stop offset=".82" stop-color="#cc984e"/><stop offset="1" stop-color="#794c1a"/></linearGradient>
        <linearGradient id="charG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#17100a"/><stop offset="1" stop-color="#3a2a1c" stop-opacity="0"/></linearGradient>
        <linearGradient id="coneG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8c8984"/><stop offset=".35" stop-color="#d3d1cc"/><stop offset=".7" stop-color="#a4a19b"/><stop offset="1" stop-color="#65625d"/></linearGradient>
        <radialGradient id="emberG"><stop offset="0" stop-color="#ffd27a"/><stop offset=".35" stop-color="#ff8a2a"/><stop offset=".7" stop-color="#e03c0c" stop-opacity=".7"/><stop offset="1" stop-color="#e03c0c" stop-opacity="0"/></radialGradient>
      </defs>

      <!-- ombra sul tavolo -->
      <circle cx="214" cy="222" r="190" fill="#000" opacity=".55" filter="url(#blur14)"/>
      <!-- corpo di ceramica -->
      <circle cx="200" cy="200" r="190" fill="url(#rimG)" stroke="#8d8470" stroke-width="1.5"/>
      <circle cx="200" cy="200" r="168" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
      <circle cx="200" cy="200" r="161" fill="none" stroke="#7d745f" stroke-opacity=".35" stroke-width="2"/>
      <path d="M62 128A150 150 0 0 1 158 52" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="5" stroke-linecap="round"/>
      <!-- conca interna e cenere -->
      <circle cx="200" cy="200" r="140" fill="url(#wellG)"/>
      <circle cx="200" cy="200" r="129" fill="url(#bedG)"/>
      <circle cx="200" cy="200" r="129" fill="#777" filter="url(#ashNoise)" opacity=".5"/>
      <g fill="#d9d5cc" opacity=".7"><circle cx="150" cy="170" r="5"/><circle cx="236" cy="150" r="4"/><circle cx="260" cy="214" r="6"/><circle cx="180" cy="262" r="4"/><circle cx="228" cy="196" r="3"/></g>
      <g fill="#5b5750" opacity=".55"><circle cx="171" cy="140" r="3"/><circle cx="214" cy="270" r="5"/><circle cx="130" cy="214" r="4"/></g>
      <!-- tre incavi per appoggiare le sigarette -->
      <g transform="translate(200 200)" fill="#9a917c" stroke="#6f664f" stroke-width="1.5">
        <rect transform="rotate(-35)" x="128" y="-15" width="62" height="30" rx="15"/>
        <rect transform="rotate(85)" x="128" y="-15" width="62" height="30" rx="15"/>
        <rect transform="rotate(205)" x="128" y="-15" width="62" height="30" rx="15"/>
      </g>

      <!-- due mozziconi spenti -->
      <g transform="translate(262 252) rotate(58)">
        <rect x="3" y="3" width="52" height="14" rx="5" fill="#000" opacity=".4" filter="url(#blur4)"/>
        <path d="M0 -7H26V7H0Z" fill="url(#filterG)"/><rect x="26" y="-7" width="3" height="14" fill="#a8873c"/>
        <path d="M29 -7H44Q50 -5 48 0Q51 5 44 7H29Z" fill="#ddd9cf"/><path d="M40 -6Q47 -3 46 1Q48 5 41 6Z" fill="#6d6155" opacity=".75"/>
      </g>
      <g transform="translate(150 292) rotate(-112)">
        <rect x="3" y="3" width="40" height="14" rx="5" fill="#000" opacity=".4" filter="url(#blur4)"/>
        <path d="M0 -7H22V7H0Z" fill="url(#filterG)"/><rect x="22" y="-7" width="3" height="14" fill="#a8873c"/>
        <path d="M25 -7H34Q40 -4 37 1Q39 5 34 7H25Z" fill="#cfcabe"/><path d="M30 -6Q38 -3 36 1Q37 5 31 6Z" fill="#5d5247" opacity=".8"/>
      </g>

      <!-- sigaretta accesa appoggiata sul bordo (brace dentro la conca) -->
      <rect transform="translate(207 212) rotate(-35)" x="-60" y="-10" width="248" height="24" rx="11" fill="#000" opacity=".5" filter="url(#blur4)"/>
      <g transform="translate(200 200) rotate(-35)">
        <path d="M110 -12H180Q186 -12 186 -6V6Q186 12 180 12H110Z" fill="url(#filterG)"/>
        <path d="M122 -12v24M130 -12v24M140 -12v24M151 -12v24M163 -12v24M174 -12v24" stroke="#7a4c18" stroke-opacity=".2" stroke-width="1"/>
        <rect x="-38" y="-12" width="150" height="24" fill="url(#paperG)"/>
        <rect x="108" y="-12" width="5" height="24" fill="#b88f35"/>
        <rect x="-36" y="-9" width="146" height="2" rx="1" fill="#fff" opacity=".7"/>
        <rect x="-42" y="-12" width="22" height="24" fill="url(#charG)"/>
        <path d="M-40 -11L-56 -10Q-63 -6 -60 -2Q-65 3 -58 7Q-55 11 -46 11L-40 11Z" fill="url(#coneG)"/>
        <path d="M-50 -8L-54 -3M-47 4L-53 7M-56 1L-60 -1" stroke="#575450" stroke-opacity=".6" stroke-width="1"/>
        <ellipse class="glow" cx="-40" cy="0" rx="8" ry="13" fill="url(#emberG)" filter="url(#blur4)"/>
        <rect x="-42" y="-11" width="4" height="22" rx="2" fill="#ff9a35"/>
      </g>
      <circle class="glow" cx="152" cy="233" r="34" fill="url(#emberG)" filter="url(#blur10)" opacity=".5"/>

      <!-- fumo -->
      <g>
        <circle class="puff" cx="152" cy="228" r="17" style="--dx:30px"/>
        <circle class="puff" cx="150" cy="228" r="15" style="--dx:70px;animation-delay:-.9s"/>
        <circle class="puff" cx="154" cy="228" r="17" style="--dx:15px;animation-delay:-1.8s"/>
        <circle class="puff" cx="151" cy="228" r="15" style="--dx:85px;animation-delay:-2.7s"/>
        <circle class="puff" cx="153" cy="228" r="17" style="--dx:45px;animation-delay:-3.6s"/>
        <circle class="puff" cx="150" cy="228" r="15" style="--dx:100px;animation-delay:-4.5s"/>
        <circle class="puff" cx="152" cy="228" r="17" style="--dx:25px;animation-delay:-5.4s"/>
        <circle class="puff" cx="154" cy="228" r="15" style="--dx:60px;animation-delay:-6.3s"/>
      </g>
    </svg>
  </div>
  </div>

  <button class="audio-btn sec" id="audioBtn" aria-label="Impostazioni audio">
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M15 29V10l16-4v19"/><ellipse cx="11" cy="29" rx="5" ry="4"/><ellipse cx="27" cy="25" rx="5" ry="4"/></svg>
  </button>
  <div class="audio-panel" id="audioPanel" hidden>
    <h2>Audio</h2>
    <label>Musica <input type="range" id="volMusic" min="0" max="1" step="0.05"></label>
    <label>Effetti <input type="range" id="volSfx" min="0" max="1" step="0.05"></label>
    <div class="row">
      <button class="sec" id="mute"></button>
      <button id="audioClose">Chiudi</button>
    </div>
  </div>

  <script type="module" src="/web/main.ts"></script>
</body>
</html>
